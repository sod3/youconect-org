services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: youconect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: youconect
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youconect"]
      interval: 5s
      retries: 5
volumes:
  postgres-data:
